<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- PDF export without PowerPoint (LibreOffice on Linux): the design-system fonts are Windows fonts, so map each
     to the closest font that is present, in order of metric similarity. Drop open-licensed fonts (e.g. Selawik,
     Barlow Semi Condensed, Inconsolata, Caladea) into tools/fonts/ to improve the match. The PPTX itself always
     keeps the real font names. pptcom.to_pdf() points FONTCONFIG_FILE here. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">fonts</dir>
  <dir>~/.fonts</dir>
  <alias binding="same"><family>Segoe UI</family>
    <prefer><family>Selawik</family><family>Open Sans</family><family>Noto Sans</family><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family>
    <prefer><family>Selawik Semibold</family><family>Open Sans SemiBold</family><family>Noto Sans</family><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Bahnschrift</family>
    <prefer><family>Barlow Semi Condensed</family><family>Roboto Condensed</family><family>Noto Sans Display</family><family>Liberation Sans Narrow</family><family>DejaVu Sans Condensed</family></prefer></alias>
  <alias binding="same"><family>Bahnschrift SemiBold</family>
    <prefer><family>Barlow Semi Condensed SemiBold</family><family>Barlow Semi Condensed</family><family>Roboto Condensed</family><family>Liberation Sans Narrow</family><family>DejaVu Sans Condensed</family></prefer></alias>
  <alias binding="same"><family>Bahnschrift Light</family>
    <prefer><family>Barlow Semi Condensed Light</family><family>Roboto Condensed</family><family>DejaVu Sans Condensed</family></prefer></alias>
  <alias binding="same"><family>Consolas</family>
    <prefer><family>Inconsolata</family><family>Cousine</family><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Cambria Math</family>
    <prefer><family>Caladea</family><family>STIX Two Math</family><family>Noto Serif</family><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Cambria</family>
    <prefer><family>Caladea</family><family>Noto Serif</family><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
